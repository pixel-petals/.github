name: Submodules

# The hook every repository calls when its main moves: runs on this
# repository's own pushes, and every other repository calls it on theirs
# (public here, so public and private alike can). Called, github.repository is
# the caller.
#
# It notifies nothing for now. It used to start .devops' submodule sync, which
# opened pull requests moving every parent's submodule pins; repositories now
# depend on each other through `github:` dependencies, so that sync is gone.
# The callers stay wired up so a central automation can hang off this job
# later without touching every repository again.

on:
  push:
    branches: [main]
  workflow_call:

permissions: {}

jobs:
  notify:
    name: Notify .devops
    runs-on: ubuntu-latest

    steps:
      - run: echo "${GITHUB_REPOSITORY}@${GITHUB_REF_NAME} moved; no automation is listening"
